services:
  app:
    build: .
    image: lineageguard:local
    ports:
      - "18214:8000"
    environment:
      LINEAGEGUARD_DB: /data/lineageguard.sqlite
      LINEAGEGUARD_RULESET: fm-2026.11.1
      TZ: UTC
    volumes:
      - lineageguard-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2).status
          except Exception:
              sys.exit(1)
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  lineageguard-data:
